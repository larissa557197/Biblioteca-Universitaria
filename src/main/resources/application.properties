# Nome da Aplica\uFFFD\uFFFDo e Porta
spring.application.name=biblioteca-universitaria
server.port=8080

# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configura\uFFFD\uFFFDes JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Autentica\uFFFD\uFFFDo JWT (Exemplo de secret seguro com +256 bits)
jwt.secret=MINHA_CHAVE_SECRETA_MUITO_GRANDE_E_SEGURA_12345
jwt.expiration=3600000

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html